; gta-sa-mcp settings. Copy next to gta-sa-mcp.asi in the game folder. Every key is optional;
; the values below are the defaults.

[ipc]
; The MCP server connects to \.\pipe\<pipe>. Change it to run two games side by side
; (and set GTA_SA_MCP_PIPE to the same name for the MCP server).
pipe=gta-sa-mcp
; How long a command waits for the game thread before answering "timeout".
request_timeout_ms=20000

[window]
; Render in a borderless desktop window instead of full screen. Its size is the resolution chosen
; in the game's display settings.
windowed=1
; Window position. Negative values (e.g. x=-3000) keep it off screen: it still renders.
x=40
y=40
; Never move the desktop's mouse pointer nor take the focus when the window is resized.
no_activate=1
; Keep simulating and rendering while another window has the focus.
run_in_background=1

[input]
; Optional local pad isolation between MCP commands. Does not suppress SA-MP UI shortcuts
; that poll OS keys directly. Menus retain their normal input.
isolate_physical=0

[startup]
; Skip the logo and intro movies.
skip_intro=1
; Start a new game from the main menu without any input.
auto_start=1
; 0: empty sandbox, main.scm does not run (no missions, no intro cutscene). 1: the normal game.
scripts=0
; Where the player appears in the sandbox (Grove Street).
spawn_x=2495.0
spawn_y=-1687.0
spawn_z=13.6

[world]
; Ambient pedestrians and traffic.
traffic=0
; The player takes no damage.
invincible=1
; Radar, health bar... Off keeps the screenshots clean.
hud=0

[capture]
; Frames rendered after a change before the next command runs, so it sees the result.
settle_frames=3
jpeg_quality=80
; Screenshots wider than this are downscaled.
max_width=1280
