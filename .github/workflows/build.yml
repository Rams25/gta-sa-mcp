name: Build

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  asi:
    name: ASI (Windows Win32)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A Win32

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item build/Release/gta-sa-mcp.asi dist/
          Copy-Item asi/gta-sa-mcp.ini dist/
          Get-ChildItem -Recurse -Filter gta-sa-mcp.map build | Select-Object -First 1 | Copy-Item -Destination dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gta-sa-mcp-asi
          path: dist/
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/gta-sa-mcp.asi
            dist/gta-sa-mcp.ini

  mcp:
    name: MCP server (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test
        working-directory: mcp
        run: npm test
